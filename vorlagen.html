<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Deine Vorlagen · KI ist Chefsache</title>
<style>
  :root{--accent:#ad8053;--accent-deep:#8a6440;--ink:#2e2b29;--ink-soft:#595550;--line:#e6ded3;--sand:#f3ece3;
        --head:"Montserrat","Segoe UI",Helvetica,Arial,sans-serif;--body:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;
       background:var(--sand);color:var(--ink);font-family:var(--body);font-size:17px}
  form{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px;
       padding:34px 30px;box-shadow:0 18px 50px rgba(46,43,41,.10)}
  h1{font-family:var(--head);font-weight:900;font-size:25px;line-height:1.2;margin:0 0 6px}
  p.sub{color:var(--ink-soft);margin:0 0 24px;font-size:15.5px;line-height:1.5}
  label{display:block;font-family:var(--head);font-weight:700;font-size:13px;letter-spacing:.04em;
        text-transform:uppercase;color:var(--ink-soft);margin:0 0 7px}
  input{width:100%;font-family:var(--body);font-size:17px;color:var(--ink);background:#fff;
        border:2px solid var(--line);border-radius:10px;padding:13px}
  input:focus{outline:none;border-color:var(--accent)}
  button{width:100%;margin-top:16px;font-family:var(--head);font-weight:700;font-size:16px;border:0;
         border-radius:10px;padding:14px 20px;background:var(--accent);color:#fff;cursor:pointer}
  button:hover{background:var(--accent-deep)}
  .fehler{color:#a8352a;font-size:15px;margin:14px 0 0;min-height:22px}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>Deine drei Vorlagen</h1>
  <p class="sub">Gib das Passwort aus dem Webinar ein – wir haben es im Chat gepostet und auf der Folie gezeigt.</p>
  <label for="pw">Passwort</label>
  <input id="pw" type="password" required autocomplete="current-password" autofocus/>
  <button type="submit">Vorlagen öffnen</button>
  <p class="fehler" id="fehler"></p>
</form>

document.getElementById("f").addEventListener("submit", async function (e) {
  e.preventDefault();
  var fehler = document.getElementById("fehler");
  fehler.textContent = "Einen Moment …";
  try {
    var roh = Uint8Array.from(atob(PAKET), function (ch) { return ch.charCodeAt(0); });
    var salt = roh.slice(0, 16), iv = roh.slice(16, 28), daten = roh.slice(28);
    var basis = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("pw").value),
      "PBKDF2", false, ["deriveKey"]);
    var k = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: 250000, hash: "SHA-256" },
      basis, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var klar = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, k, daten);
    document.open(); document.write(new TextDecoder().decode(klar)); document.close();
  } catch (err) {
    fehler.textContent = "Das Passwort stimmt nicht.";
  }
});
